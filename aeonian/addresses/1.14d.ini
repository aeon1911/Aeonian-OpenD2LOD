; 2026-10-29 documentada em docs/specs/game-exe-1.14d-units.md e
; docs/specs/game-exe-1.14d-levels-automap.md. Globais de dados nao tem bytes
; fixos: cada um e lido de uma ancora verificada (a descricao diz o deslocamento
; do endereco dentro dos bytes). Simbolos marcados 'nao chamar' existem so como
; referencia e ancora.

