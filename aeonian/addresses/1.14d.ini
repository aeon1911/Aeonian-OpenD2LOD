;
; Banco de enderecos do Game.exe do Diablo II: Lord of Destruction 1.14d
; (versao de recurso 1.14.3.71, PE32 monolitico, ImageBase 0x00400000).
;
; Cada simbolo e um FATO de interoperabilidade (endereco + bytes esperados)
; obtido por analise documentada em docs/specs/. Nao ha codigo da Blizzard
; aqui. O tempo de execucao so usa um simbolo se os bytes conferirem.
;
; Para acrescentar um simbolo:
;   1. documente a analise em docs/specs/ (como o endereco foi achado);
;   2. copie os bytes da funcao (o suficiente para identifica-la e para um
;      hook de >= 5 bytes) em `bytes`;
;   3. nunca invente enderecos: um simbolo nao verificado nao entra.

[build]
name          = 1.14d
id            = 1
timestamp     = 0x574ddfbc
size_of_image = 0x5ba000
entry_rva     = 0x282985
; SHA-256 do Game.exe 1.14d (PE, 3.618.792 bytes); usado pelo instalador.
sha256        = 631066c1649c4ea9ffe48bf97e24c00bca1f7a6759c21150f1a79982589adaaf

[symbol.Game.EntryPoint]
rva         = 0x282985
bytes       = e8 1b 9f 00 00 e9 16 fe ff ff
description = Entry point do PE (stub do CRT: call + jmp). Ja executado quando os plugins carregam; serve de ancora para testar o motor de hooks.

