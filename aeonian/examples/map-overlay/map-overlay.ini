; Configuracao do mod map-overlay. Referencia: docs/modding/MAP_OVERLAY.md
; O arquivo e opcional; sem ele valem os padroes abaixo (exceto os nomes).

[overlay]
enabled            = 1
; liga/desliga as marcas: f1..f24 ou uma letra/numero, com ctrl+/shift+
toggle_key         = f11
monsters           = 1     ; monstros vivos (normal, lacaio, campeao, unico, superunico)
allies             = 1     ; mercenario e invocacoes, em cor propria (nunca como hostis)
npcs               = 1     ; NPCs e os amigos fora da lista de aliados (classes 359 e 522)
objects            = 1     ; waypoints, portais e os objetos da secao [objects]
quests             = 1     ; objetivos de quest, pela coluna OperateFn da tabela do jogo
exits              = 1     ; saidas (warps e passagens abertas com outros niveis)
labels             = 1     ; rotulos (destino das saidas, nome dos objetos)
status             = 1     ; linha de contagem no topo do quadro
only_current_level = 1     ; ignora unidades de salas de niveis vizinhos
refresh_ms         = 100   ; intervalo entre varreduras do estado do jogo
draw_hook          = 1     ; conta as chamadas do DrawAutomap do jogo (so desenha quando ele desenha)
; EXPERIMENTAL, desligado por padrao. Chama AddRoomData/RemoveRoomData do jogo na
; sala de um warp para achar a posicao exata da saida antes de chegar perto. Testado
; so em Normal, um jogador, em sessoes curtas; nao use em multijogador. Ver
; docs/modding/MAP_OVERLAY.md.
reveal_exits       = 0

[objects]
; Ajustes manuais; waypoints, portais e objetivos NAO precisam estar aqui, porque vem
; das colunas da tabela do jogo. Confira a classe no objects.txt da SUA instalacao.
;   <linha de objects.txt> = rotulo   marca outra classe, ou troca o rotulo de um objetivo
;   <linha de objects.txt> = -        tira a classe dos objetivos

[level_names]
; <id de levels.txt> = nome mostrado nas saidas (sem nome: "nivel <id>").
1 = Cidade (Ato I)
2 = Charneca Sangrenta
8 = Covil do Mal
40 = Cidade (Ato II)
75 = Cidade (Ato III)
103 = Cidade (Ato IV)
109 = Cidade (Ato V)

[d2gl]
; No D2GL o canvas tem o tamanho da janela e o D2GL encaixa nela o quadro do
; jogo. O tamanho do quadro vem do proprio jogo (640x480 ou 800x600); game_width e
; game_height so valem se ele nao puder ser lido. Com use_d2gl_ini = 1 o encaixe
; segue o d2gl.ini da pasta do jogo (janela pedida, tela cheia, esticado);
; sem ele, o quadro e centralizado no canvas (keep_aspect) ou esticado.
game_width   = 800
game_height  = 600
use_d2gl_ini = 1
keep_aspect  = 1
