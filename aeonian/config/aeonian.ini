; Aeonian - configuracao (copiada para <jogo>/aeonian/aeonian.ini na instalacao;
; seus ajustes nunca sao sobrescritos por uma reinstalacao).

[core]
; debug | info | warn | error. O log fica em aeonian/aeonian.log.
log_level = info

; O jogo so le arquivos soltos de <jogo>\data\ no modo -direct.
;   auto = acrescenta -direct quando algum mod traz uma pasta data\
;   on   = sempre    off = nunca
force_direct = auto

; 0 = em uma build do Game.exe desconhecida o Aeonian se desativa (seguro).
; 1 = tenta funcionar mesmo assim (so hooks de arquivo/evento; sem simbolos).
allow_unknown_build = 0

; 1 = registra no log (nivel debug) cada arquivo de data\ que o jogo pede e de
; quem veio. Util para descobrir o caminho exato do que voce quer substituir.
trace_files = 0

; Flags extras de linha de comando do Game.exe, separadas por espaco.
; Exemplo: extra_args = -w -skiptobnet
extra_args =

[video]
; Renderizador. auto = D2GL (OpenGL: alto desempenho, widescreen, 4K, alto
; refresh) quando glide3x.dll + d2gl.mpq estao na pasta do jogo; senao o
; renderizador original (GDI/DirectDraw). d2gl = exige o D2GL; software =
; sempre o original. Com o D2GL o Aeonian acrescenta -3dfx e remove -w.
backend = auto
; Qual wrapper do D2GL usar quando ambos estao instalados. auto = glide
; (glide3x.dll + -3dfx; o caminho validado sob Wine); ddraw = ddraw.dll (nao
; usa -3dfx; no Wine o wrapper DDraw do D2GL travou nos testes, mesmo sem o
; Aeonian).
d2gl_mode = auto
; Largura maxima (px) do canvas dos plugins no modo D2GL (esticado sobre a
; janela) e quantas vezes por segundo ele e redesenhado.
overlay_max_width = 1920
overlay_hz = 60

[game]
; Pula os videos de abertura (logos da Blizzard). true = os 2 primeiros videos
; abertos nos primeiros 30 s; um numero = quantos; false = nao pular.
; Cinematicas abertas depois pelo menu nao sao afetadas.
skip_intro = true
skip_intro_window = 30

[mods]
; ids de mods a ignorar, separados por virgula (sem apagar a pasta).
disabled =
